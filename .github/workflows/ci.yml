name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate installer syntax
        run: bash -n install.sh
      - name: Compile source
        run: python -m compileall -q pcredz_ultimate
      - name: Run unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Validate package metadata
        run: python -m pip install --no-deps .

  live-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install libpcap build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libpcap-dev pkg-config
      - name: Exercise live installer
        run: PCREDZ_PYTHON=python PCREDZ_VENV=/tmp/pcu-live ./install.sh --live --no-system-packages
      - name: Validate pcapy-ng import
        run: /tmp/pcu-live/bin/python -c 'import pcapy; print(pcapy.__file__); print(pcapy.findalldevs())'
