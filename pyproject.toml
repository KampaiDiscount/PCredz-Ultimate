[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pcredz-ultimate"
version = "3.1.1"
description = "Passive credential and authentication-material auditing for authorized PCAP and live network captures"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "PCredz original project contributors"},
  {name = "PCredz Ultimate rewrite contributors"}
]
keywords = ["pcap", "network-security", "credentials", "forensics", "audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
live = ["pcapy-ng>=2.0.0,<3"]
dev = ["pytest>=8"]

[project.scripts]
pcredz-ultimate = "pcredz_ultimate.cli:main"
pcredz = "pcredz_ultimate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pcredz_ultimate*"]
